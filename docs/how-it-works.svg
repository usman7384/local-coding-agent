<svg xmlns="http://www.w3.org/2000/svg" width="680" height="416" viewBox="0 0 680 416" role="img"><title>How the minimal harness works</title><desc>The buggy repo is copied to a temp folder; agent.py asks the model for one action at a time and sandbox.py runs commands in Docker against that folder; grade.py runs visible and hidden tests; results are saved per attempt.</desc><style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="416" fill="#FFFFFF"/><g class="c-gray"><rect x="40" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="58.0" text-anchor="middle" dominant-baseline="central">tasks/&lt;id&gt;/repo</text><text class="ts" x="170.0" y="78.0" text-anchor="middle" dominant-baseline="central">Buggy project + visible tests</text></g><g class="c-gray"><rect x="380" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510.0" y="58.0" text-anchor="middle" dominant-baseline="central">Temp folder</text><text class="ts" x="510.0" y="78.0" text-anchor="middle" dominant-baseline="central">A fresh copy per attempt</text></g><g class="c-purple"><rect x="40" y="160" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="178.0" text-anchor="middle" dominant-baseline="central">agent.py</text><text class="ts" x="170.0" y="198.0" text-anchor="middle" dominant-baseline="central">Model picks one action</text></g><g class="c-teal"><rect x="380" y="160" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510.0" y="178.0" text-anchor="middle" dominant-baseline="central">sandbox.py</text><text class="ts" x="510.0" y="198.0" text-anchor="middle" dominant-baseline="central">Runs BASH in Docker</text></g><g class="c-gray"><rect x="380" y="280" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510.0" y="298.0" text-anchor="middle" dominant-baseline="central">grade.py</text><text class="ts" x="510.0" y="318.0" text-anchor="middle" dominant-baseline="central">Visible + hidden tests</text></g><g class="c-gray"><rect x="40" y="280" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="298.0" text-anchor="middle" dominant-baseline="central">results/&lt;run&gt;/</text><text class="ts" x="170.0" y="318.0" text-anchor="middle" dominant-baseline="central">One line per attempt</text></g><line x1="300" y1="68" x2="378" y2="68" class="arr" marker-end="url(#arrow)"/><line x1="510" y1="96" x2="510" y2="158" class="arr" marker-end="url(#arrow)"/><line x1="300" y1="180" x2="378" y2="180" class="arr" marker-end="url(#arrow)"/><line x1="380" y1="200" x2="302" y2="200" class="arr" marker-end="url(#arrow)"/><line x1="510" y1="216" x2="510" y2="278" class="arr" marker-end="url(#arrow)"/><line x1="380" y1="308" x2="302" y2="308" class="arr" marker-end="url(#arrow)"/><line x1="292" y1="158" x2="388" y2="98" class="arr" marker-end="url(#arrow)"/><text class="ts" x="318" y="116" text-anchor="end" dominant-baseline="central">EDIT</text><text class="ts" x="339" y="168" text-anchor="middle" dominant-baseline="central">BASH</text><text class="ts" x="339" y="214" text-anchor="middle" dominant-baseline="central">output</text><text class="ts" x="339" y="56" text-anchor="middle" dominant-baseline="central">copy</text><text class="ts" x="518" y="127" text-anchor="start" dominant-baseline="central">mounted at /work</text><text class="ts" x="518" y="247" text-anchor="start" dominant-baseline="central">after DONE</text><rect class="c-purple" x="40" y="376" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="62" y="383" dominant-baseline="central">Model</text><rect class="c-teal" x="150" y="376" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="172" y="383" dominant-baseline="central">Docker</text><rect class="c-gray" x="262" y="376" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="284" y="383" dominant-baseline="central">Files and scripts</text></svg>
