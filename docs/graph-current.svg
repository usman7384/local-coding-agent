<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img"><title>Agent architecture</title><desc>setup, then optional memory and a read-only explorer sub-agent, then call_model through a gateway with a context panel. Tool calls pass optional guardrails and run as native tools or over MCP; results return. A reply without a tool call goes to verify (visible tests), then an optional critic sub-agent. A failure or rejection gives one retry with a lesson; when the tries are used up, optional best-of-N starts a fresh sample, otherwise grade, with traces of every call.</desc><style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.tl{font-size:12px;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}.opt{stroke-dasharray:6 4}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="600" fill="#FFFFFF"/>
<g class="c-gray"><rect x="240" y="16" width="120" height="30" rx="15" stroke-width="0.5"/><text class="th" x="300" y="31" text-anchor="middle" dominant-baseline="central">__start__</text></g>
<g class="c-teal"><rect x="200" y="70" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="300" y="86" text-anchor="middle" dominant-baseline="central">setup</text><text class="ts" x="300" y="103" text-anchor="middle" dominant-baseline="central">fresh copy, bug report</text></g>
<g class="c-teal"><rect class="opt" x="20" y="70" width="150" height="44" rx="8" stroke-width="1"/><text class="th" x="95" y="86" text-anchor="middle" dominant-baseline="central">memory</text><text class="ts" x="95" y="103" text-anchor="middle" dominant-baseline="central">AGENT_MEMORY</text></g>
<g class="c-purple"><rect class="opt" x="200" y="136" width="200" height="44" rx="8" stroke-width="1"/><text class="th" x="300" y="152" text-anchor="middle" dominant-baseline="central">explore</text><text class="ts" x="300" y="169" text-anchor="middle" dominant-baseline="central">read-only · AGENT_EXPLORER</text></g>
<g class="c-purple"><rect x="200" y="210" width="200" height="52" rx="8" stroke-width="0.5"/><text class="th" x="300" y="228" text-anchor="middle" dominant-baseline="central">call_model</text><text class="ts" x="300" y="248" text-anchor="middle" dominant-baseline="central">gateway: any chat API</text></g>
<g class="c-teal"><rect x="20" y="204" width="150" height="64" rx="8" stroke-width="0.5"/><text class="th" x="95" y="221" text-anchor="middle" dominant-baseline="central">context</text><text class="ts" x="95" y="240" text-anchor="middle" dominant-baseline="central">open files, plan</text><text class="ts" x="95" y="256" text-anchor="middle" dominant-baseline="central">AGENT_COMPACT</text></g>
<g class="c-teal"><rect class="opt" x="450" y="210" width="150" height="52" rx="8" stroke-width="1"/><text class="th" x="525" y="228" text-anchor="middle" dominant-baseline="central">guardrails</text><text class="ts" x="525" y="248" text-anchor="middle" dominant-baseline="central">AGENT_GUARDRAILS</text></g>
<g class="c-teal"><rect x="626" y="202" width="160" height="68" rx="8" stroke-width="0.5"/><text class="th" x="706" y="220" text-anchor="middle" dominant-baseline="central">tools</text><text class="ts" x="706" y="239" text-anchor="middle" dominant-baseline="central">bash · view · search · edit</text><text class="ts" x="706" y="256" text-anchor="middle" dominant-baseline="central">native calls or MCP</text></g>
<g class="c-teal"><rect x="200" y="320" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="300" y="336" text-anchor="middle" dominant-baseline="central">verify</text><text class="ts" x="300" y="353" text-anchor="middle" dominant-baseline="central">harness runs visible tests</text></g>
<g class="c-purple"><rect class="opt" x="200" y="384" width="200" height="44" rx="8" stroke-width="1"/><text class="th" x="300" y="400" text-anchor="middle" dominant-baseline="central">critic</text><text class="ts" x="300" y="417" text-anchor="middle" dominant-baseline="central">reject = an assert · AGENT_CRITIC</text></g>
<g class="c-teal"><rect class="opt" x="460" y="384" width="180" height="44" rx="8" stroke-width="1"/><text class="th" x="550" y="400" text-anchor="middle" dominant-baseline="central">best-of-N</text><text class="ts" x="550" y="417" text-anchor="middle" dominant-baseline="central">AGENT_SAMPLES</text></g>
<g class="c-gray"><rect x="200" y="474" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="300" y="490" text-anchor="middle" dominant-baseline="central">grade</text><text class="ts" x="300" y="507" text-anchor="middle" dominant-baseline="central">visible + hidden tests</text></g>
<g class="c-teal"><rect x="20" y="474" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="95" y="490" text-anchor="middle" dominant-baseline="central">traces</text><text class="ts" x="95" y="507" text-anchor="middle" dominant-baseline="central">spans, tokens, cost</text></g>
<g class="c-gray"><rect x="240" y="546" width="120" height="30" rx="15" stroke-width="0.5"/><text class="th" x="300" y="561" text-anchor="middle" dominant-baseline="central">__end__</text></g>
<path class="arr" d="M300 46V68" marker-end="url(#arrow)"/>
<path class="arr" d="M300 114V134" marker-end="url(#arrow)"/>
<path class="arr" d="M300 180V208" marker-end="url(#arrow)"/>
<path class="arr" d="M170 92H185V158H198" marker-end="url(#arrow)"/>
<path class="arr" d="M170 248H198" marker-end="url(#arrow)"/>
<path class="arr dash" d="M400 236H448" marker-end="url(#arrow)"/><text class="tl" x="424" y="228" text-anchor="middle">calls</text>
<path class="arr" d="M600 236H624" marker-end="url(#arrow)"/>
<path class="arr" d="M706 202V190H340V208" marker-end="url(#arrow)"/><text class="tl" x="560" y="184" text-anchor="middle">results</text>
<path class="arr dash" d="M300 262V318" marker-end="url(#arrow)"/><text class="tl" x="292" y="288" text-anchor="end">no tool call</text>
<path class="arr dash" d="M300 364V382" marker-end="url(#arrow)"/><text class="tl" x="308" y="377">pass</text>
<path class="arr dash" d="M300 428V472" marker-end="url(#arrow)"/><text class="tl" x="308" y="454">accept</text>
<path class="arr" d="M300 518V544" marker-end="url(#arrow)"/>
<path class="arr" d="M200 496H172" marker-end="url(#arrow)"/>
<path class="arr dash" d="M200 342H185V222H198" marker-end="url(#arrow)"/>
<path class="arr dash" d="M200 406H185V342"/>
<text class="tl" x="178" y="330" text-anchor="end">fail or reject:</text><text class="tl" x="178" y="346" text-anchor="end">one retry</text><text class="tl" x="178" y="362" text-anchor="end">+ lesson</text>
<path class="arr dash" d="M400 406H458" marker-end="url(#arrow)"/><text class="tl" x="430" y="398" text-anchor="middle">tries</text><text class="tl" x="430" y="442" text-anchor="middle">used up</text>
<path class="arr dash" d="M550 384V300H360V264" marker-end="url(#arrow)"/><text class="tl" x="560" y="330">fresh sample</text>
<path class="arr dash" d="M550 428V496H402" marker-end="url(#arrow)"/><text class="tl" x="560" y="470">none left</text>
<g transform="translate(470,26)"><rect class="c-purple" x="0" y="0" width="16" height="12" rx="3" stroke-width="0.5"/><text class="ts" x="24" y="10">calls the LLM</text><rect class="c-teal" x="0" y="20" width="16" height="12" rx="3" stroke-width="0.5"/><text class="ts" x="24" y="30">plain Python</text><rect class="c-gray opt" x="0" y="40" width="16" height="12" rx="3" stroke-width="1"/><text class="ts" x="24" y="50">switch, off by default</text><path class="arr dash" d="M0 66H16"/><text class="ts" x="24" y="70">branch, picked by the reply or tests</text></g>
</svg>
