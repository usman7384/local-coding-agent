<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img"><title>Current agent graph</title><desc>start, setup, call_model; the reply picks bash, edit or malformed, each returns to call_model; DONE or 20 steps goes to grade, then end.</desc><style>
