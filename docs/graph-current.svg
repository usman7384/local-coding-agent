<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" viewBox="0 0 780 640" role="img"><title>Current agent graph</title><desc>start, setup, an optional read-only explorer sub-agent, then call_model with an open-files panel. The model answers with native tool calls (bash, view, search, edit; a bad call returns an error), whose results go back into the conversation, or with no tool call, which goes to verify: the harness runs the visible tests. If they pass, an optional critic sub-agent may reject the fix with an assert that runs. A failure or rejection gives one retry with a fresh conversation and a lesson; otherwise grade, then end.</desc><style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.tl{font-size:12px;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}.opt{stroke-dasharray:6 4}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="780" height="640" fill="#FFFFFF"/>
<g class="c-gray"><rect x="240" y="20" width="120" height="32" rx="16" stroke-width="0.5"/><text class="th" x="300" y="36" text-anchor="middle" dominant-baseline="central">__start__</text></g>
<g class="c-teal"><rect x="200" y="78" width="200" height="46" rx="8" stroke-width="0.5"/><text class="th" x="300" y="95" text-anchor="middle" dominant-baseline="central">setup</text><text class="ts" x="300" y="113" text-anchor="middle" dominant-baseline="central">copy repo, read bug report</text></g>
<g class="c-purple"><rect class="opt" x="200" y="150" width="200" height="46" rx="8" stroke-width="1"/><text class="th" x="300" y="167" text-anchor="middle" dominant-baseline="central">explore · AGENT_EXPLORER</text><text class="ts" x="300" y="185" text-anchor="middle" dominant-baseline="central">read-only sub-agent: view, search</text></g>
<g class="c-purple"><rect x="200" y="226" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="300" y="245" text-anchor="middle" dominant-baseline="central">call_model</text><text class="ts" x="300" y="265" text-anchor="middle" dominant-baseline="central">conversation + tool list</text></g>
<g class="c-teal"><rect x="20" y="226" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="95" y="245" text-anchor="middle" dominant-baseline="central">open files</text><text class="ts" x="95" y="265" text-anchor="middle" dominant-baseline="central">fresh from disk, 2 max</text></g>
<g class="c-teal"><rect x="490" y="212" width="250" height="84" rx="8" stroke-width="0.5"/><text class="th" x="615" y="232" text-anchor="middle" dominant-baseline="central">tools (tools.py)</text><text class="ts" x="615" y="254" text-anchor="middle" dominant-baseline="central">bash in Docker · view · search · edit</text><text class="ts" x="615" y="274" text-anchor="middle" dominant-baseline="central">a bad call runs nothing, returns an error</text></g>
<g class="c-teal"><rect x="200" y="350" width="200" height="46" rx="8" stroke-width="0.5"/><text class="th" x="300" y="367" text-anchor="middle" dominant-baseline="central">verify</text><text class="ts" x="300" y="385" text-anchor="middle" dominant-baseline="central">harness runs the visible tests</text></g>
<g class="c-purple"><rect class="opt" x="200" y="430" width="200" height="46" rx="8" stroke-width="1"/><text class="th" x="300" y="447" text-anchor="middle" dominant-baseline="central">critic · AGENT_CRITIC</text><text class="ts" x="300" y="465" text-anchor="middle" dominant-baseline="central">reject = an assert that runs</text></g>
<g class="c-gray"><rect x="200" y="510" width="200" height="46" rx="8" stroke-width="0.5"/><text class="th" x="300" y="527" text-anchor="middle" dominant-baseline="central">grade</text><text class="ts" x="300" y="545" text-anchor="middle" dominant-baseline="central">visible + hidden tests, pass^k</text></g>
<g class="c-gray"><rect x="240" y="586" width="120" height="32" rx="16" stroke-width="0.5"/><text class="th" x="300" y="602" text-anchor="middle" dominant-baseline="central">__end__</text></g>
<path class="arr" d="M300 52V76" marker-end="url(#arrow)"/>
<path class="arr" d="M300 124V148" marker-end="url(#arrow)"/>
<path class="arr" d="M300 196V224" marker-end="url(#arrow)"/>
<path class="arr" d="M170 254H198" marker-end="url(#arrow)"/>
<path class="arr dash" d="M400 240H488" marker-end="url(#arrow)"/><text class="tl" x="444" y="232" text-anchor="middle">tool calls</text>
<path class="arr" d="M490 270H402" marker-end="url(#arrow)"/><text class="tl" x="444" y="288" text-anchor="middle">results</text>
<path class="arr dash" d="M300 282V348" marker-end="url(#arrow)"/><text class="tl" x="292" y="318" text-anchor="end">no tool call (done)</text><text class="tl" x="292" y="334" text-anchor="end">or 20 steps</text>
<path class="arr dash" d="M300 396V428" marker-end="url(#arrow)"/><text class="tl" x="308" y="416">pass</text>
<path class="arr dash" d="M300 476V508" marker-end="url(#arrow)"/><text class="tl" x="308" y="496">accept</text>
<path class="arr" d="M300 556V584" marker-end="url(#arrow)"/>
<path class="arr dash" d="M400 373H450V312H362V284" marker-end="url(#arrow)"/>
<path class="arr dash" d="M400 453H450V373"/>
<text class="tl" x="460" y="400">fail or reject:</text><text class="tl" x="460" y="416">one retry, fresh</text><text class="tl" x="460" y="432">conversation + lesson</text>
<g transform="translate(500,500)"><rect class="c-purple" x="0" y="0" width="16" height="12" rx="3" stroke-width="0.5"/><text class="ts" x="24" y="10">calls the LLM</text><rect class="c-teal" x="0" y="20" width="16" height="12" rx="3" stroke-width="0.5"/><text class="ts" x="24" y="30">plain Python</text><rect class="c-purple opt" x="0" y="40" width="16" height="12" rx="3" stroke-width="1"/><text class="ts" x="24" y="50">switch, off by default (skipped)</text><path class="arr dash" d="M0 66H16"/><text class="ts" x="24" y="70">branch, picked by the reply or tests</text></g>
</svg>
