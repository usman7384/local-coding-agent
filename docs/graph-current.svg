<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img"><title>Current agent graph</title><desc>start, setup, call_model (with an open-files panel); the reply picks bash, view, search, edit or malformed, each returns to call_model; DONE or 20 steps goes to verify, which runs the visible tests: if they fail, one retry goes back to call_model with a fresh conversation and a lesson; otherwise grade, then end.</desc><style>
