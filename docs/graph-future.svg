<text class="ts" x="0" y="122">S1 measure · S2 tools · S3 context · S4 sub-agents</text><text class="ts" x="0" y="140">S5 test-time compute · S6 models · S7 tasks</text><text class="ts" x="0" y="158">S8 MCP · S9 self-improvement · S10 safety, ops</text></g>
