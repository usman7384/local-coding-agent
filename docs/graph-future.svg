<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img"><title>Target agent graph</title><desc>The target design, each node tagged with the stage that adds it: tasks (S7), opt-in memory (S9), explorer (S4), plan (S3), call_model through a model gateway (S6), context with compaction (S3), guardrails (S10), tools over native calls and MCP (S2, S8), verify, critic and best-of-N (S5), grade (S1), traces (S10), and a feedback edge from graded runs into memory (S9).</desc><style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.tl{font-size:12px;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}.opt{stroke-dasharray:6 4}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-amber>rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="700" fill="#FFFFFF"/>
<g class="c-gray"><rect x="240" y="16" width="120" height="30" rx="15" stroke-width="0.5"/><text class="th" x="300" y="31" text-anchor="middle" dominant-baseline="central">__start__</text></g>
<g class="c-amber"><rect x="200" y="70" width="200" height="46" rx="8" stroke-width="0.5"/><text class="th" x="300" y="87" text-anchor="middle" dominant-baseline="central">tasks · S7</text><text class="ts" x="300" y="105" text-anchor="middle" dominant-baseline="central">119 today; harder, larger repos</text></g>
<g class="c-amber"><rect class="opt" x="20" y="70" width="150" height="46" rx="8" stroke-width="1"/><text class="th" x="95" y="87" text-anchor="middle" dominant-baseline="central">memory · S9</text><text class="ts" x="95" y="105" text-anchor="middle" dominant-baseline="central">opt-in, eval-gated</text></g>
<g class="c-purple"><rect class="opt" x="200" y="140" width="200" height="46" rx="8" stroke-width="1"/><text class="th" x="300" y="157" text-anchor="middle" dominant-baseline="central">explore · S4</text><text class="ts" x="300" y="175" text-anchor="middle" dominant-baseline="central">read-only sub-agent</text></g>
<g class="c-amber"><rect x="200" y="206" width="200" height="46" rx="8" stroke-width="0.5"/><text class="th" x="300" y="223" text-anchor="middle" dominant-baseline="central">plan · S3</text><text class="ts" x="300" y="241" text-anchor="middle" dominant-baseline="central">plan + notes file</text></g>
<g class="c-purple"><rect x="200" y="272" width="200" height="52" rx="8" stroke-width="0.5"/><text class="th" x="300" y="290" text-anchor="middle" dominant-baseline="central">call_model · S6</text><text class="ts" x="300" y="310" text-anchor="middle" dominant-baseline="central">gateway: local or API model</text></g>
<g class="c-teal"><rect x="20" y="272" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="95" y="290" text-anchor="middle" dominant-baseline="central">context · S3</text><text class="ts" x="95" y="310" text-anchor="middle" dominant-baseline="central">open files, compaction</text></g>
<g class="c-amber"><rect x="460" y="272" width="140" height="52" rx="8" stroke-width="0.5"/><text class="th" x="530" y="290" text-anchor="middle" dominant-baseline="central">guardrails · S10</text><text class="ts" x="530" y="310" text-anchor="middle" dominant-baseline="central">allow-list, budget</text></g>
<g class="c-teal"><rect x="626" y="264" width="160" height="68" rx="8" stroke-width="0.5"/><text class="th" x="706" y="282" text-anchor="middle" dominant-baseline="central">tools · S2, S8</text><text class="ts" x="706" y="301" text-anchor="middle" dominant-baseline="central">native tool calls</text><text class="ts" x="706" y="318" text-anchor="middle" dominant-baseline="central">MCP servers, hooks</text></g>
<g class="c-teal"><rect x="200" y="372" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="300" y="388" text-anchor="middle" dominant-baseline="central">verify · S5</text><text class="ts" x="300" y="405" text-anchor="middle" dominant-baseline="central">visible tests</text></g>
<g class="c-purple"><rect class="opt" x="200" y="438" width="200" height="44" rx="8" stroke-width="1"/><text class="th" x="300" y="454" text-anchor="middle" dominant-baseline="central">critic · S5</text><text class="ts" x="300" y="471" text-anchor="middle" dominant-baseline="central">reject = an assert that runs</text></g>
<g class="c-amber"><rect x="200" y="504" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="300" y="520" text-anchor="middle" dominant-baseline="central">best-of-N · S5</text><text class="ts" x="300" y="537" text-anchor="middle" dominant-baseline="central">parallel tries, keep a passing one</text></g>
<g class="c-gray"><rect x="200" y="570" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="300" y="586" text-anchor="middle" dominant-baseline="central">grade · S1</text><text class="ts" x="300" y="603" text-anchor="middle" dominant-baseline="central">pass^k, CIs, noise</text></g>
<g class="c-amber"><rect x="460" y="570" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="560" y="586" text-anchor="middle" dominant-baseline="central">traces · S10</text><text class="ts" x="560" y="603" text-anchor="middle" dominant-baseline="central">spans, cost, replay</text></g>
<g class="c-gray"><rect x="240" y="640" width="120" height="30" rx="15" stroke-width="0.5"/><text class="th" x="300" y="655" text-anchor="middle" dominant-baseline="central">__end__</text></g>
